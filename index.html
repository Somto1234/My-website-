<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="Somto Tech Class " content="Learn coding the simple and smart way 💻">
  <meta name="Join our tech community to start building real websites, apps, and digital skills" content="Somto Tech Class - Learn coding easily">
  <title>Somto Tech Class</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;

      background: linear-gradient(-45deg, #1e3c72, #2a5298, #00c6ff, #0072ff);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* FLOATING CIRCLES */
    .circle {
      position: fixed;
      width: 100px;
      height: 100px;
      background: rgba(0,255,255,0.2);
      border-radius: 50%;
      animation: float 10s infinite;
      z-index: 0;
    }

    .circle:nth-child(1) { top: 10%; left: 10%; }
    .circle:nth-child(2) { top: 50%; left: 80%; }
    .circle:nth-child(3) { top: 80%; left: 30%; }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-50px); }
      100% { transform: translateY(0); }
    }

    /* LOGIN BOX */
    .login-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 300px;
      margin: 100px auto;
      box-shadow: 0 0 20px black;
      position: relative;
      z-index: 1;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: 1px solid gray;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: blue;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    #mainSite {
      display: none;
      position: relative;
      z-index: 1;
    }

    /* CARD */
    .card {
      background: #dcdcdc;
      padding: 20px;
      border-radius: 15px;
      max-width: 350px;
      margin: auto;
      box-shadow: 0 0 70px red;
    }

    /* PROFILE IMAGE */
    .profile-img {
      width: 120px;
      border-radius: 10%;
      border: 4px solid lime;

      box-shadow: 0 0 10px lime,
                  0 0 20px lime,
                  0 0 30px lime;
    }

    h1 {
      color: blue;
      margin-top: 10px;
    }

    p {
      color: orange;
      font-weight: 300;
    }

    /* BUTTONS */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;

      margin: 15px auto;
      width: 220px;
      padding: 12px;

      text-decoration: none;
      font-weight: bold;
      color: white;

      border-radius: 8px;
      font-size: 16px;

      animation: blink 1.2s infinite;
      box-shadow: 0 0 20px rgba(0,255,255,0.6);
    }

    .whatsapp {
      background: green;
    }

    .telegram {
      background: #0088cc;
    }

    .btn img {
      width: 24px;
      border-radius: 50%;

      box-shadow: 0 0 5px white,
                  0 0 10px white,
                  0 0 20px cyan;

      animation: glow 1.5s infinite alternate;
    }

    .btn:hover {
      background: red;
      transform: scale(1.05);
      transition: 0.3s;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 5px white,
                    0 0 10px white;
      }
      to {
        box-shadow: 0 0 10px cyan,
                    0 0 20px cyan,
                    0 0 30px cyan;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND EFFECT -->
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <!-- LOGIN / SIGNUP -->
  <div class="login-box">
    <h2>Login / Create Account 🔐</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Create Account</button>

    <p id="error" style="color:red;"></p>
  </div>

  <!-- MAIN SITE -->
  <div id="mainSite">

    <div class="card">

      <img src="https://image2url.com/r2/default/images/1774260617224-5a9b2fdb-7960-48cc-b8f9-c22de2bfeab7.jpeg" class="profile-img">

      <h1>SOMTO TECH CLASS</h1>

      <p id="welcomeText"></p>
      <p>Hello guys I'm teaching you coding 💻</p>
      <p>Tap WhatsApp or Telegram to learn more 🚀</p>

      <a href="https://wa.me/message/UAW5R3JSDE23B1" class="btn whatsapp">
        <img src="https://img.icons8.com/color/48/whatsapp.png">
        Contact us on WhatsApp
      </a>

      <a href="https://t.me/BET_INSIDER_PRO1" class="btn telegram">
        <img src="https://img.icons8.com/color/48/telegram-app.png">
        Contact us on Telegram
      </a>

      <button onclick="logout()">Logout</button>

    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    function signup() {
      let user = username.value;
      let pass = password.value;

      if (!user || !pass) {
        error.innerText = "Fill all fields!";
        return;
      }

      let users = JSON.parse(localStorage.getItem("users")) || [];

      if (users.find(u => u.username === user)) {
        error.innerText = "User already exists!";
        return;
      }

      users.push({ username: user, password: pass });
      localStorage.setItem("users", JSON.stringify(users));

      login();
    }

    function login() {
      let user = username.value;
      let pass = password.value;

      let users = JSON.parse(localStorage.getItem("users")) || [];

      let valid = users.find(u => u.username === user && u.password === pass);

      if (valid) {
        document.querySelector(".login-box").style.display = "none";
        mainSite.style.display = "block";
        welcomeText.innerText = "Welcome " + user + " 🎉";
        localStorage.setItem("currentUser", user);
      } else {
        error.innerText = "Wrong username or password!";
      }
    }

    function logout() {
      localStorage.removeItem("currentUser");
      location.reload();
    }

    window.onload = function () {
      let user = localStorage.getItem("currentUser");
      if (user) {
        document.querySelector(".login-box").style.display = "none";
        mainSite.style.display = "block";
        welcomeText.innerText = "Welcome " + user + " 🎉";
      }
    };
  </script>

</body>
</html>
